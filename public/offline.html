<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>Hors ligne · JFLX</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,#142134,#090b12 58%);color:#f7f8fb;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,480px);padding:40px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff08;text-align:center;box-shadow:0 30px 90px #0008}.mark{margin:0;color:#e50914;font-size:25px;font-weight:900;letter-spacing:-.08em}.signal{display:grid;place-items:center;width:56px;height:56px;margin:30px auto 18px;border:1px solid #ffffff26;border-radius:18px;color:#61c7f0;font-size:25px}.eyebrow{margin:0;color:#76c9ed;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:30px;line-height:1.15}.copy{margin:0;color:#a7adba}.retry{margin-top:25px;border:0;border-radius:999px;padding:12px 20px;background:#e50914;color:#fff;font:inherit;font-weight:700;cursor:pointer}.retry:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:520px){.card{padding:30px 22px}}
</style>
</head>
<body><main class="card"><p class="mark">JFLX</p><div class="signal" aria-hidden="true">⌁</div><p class="eyebrow">Connexion interrompue</p><h1>Contenu indisponible hors ligne</h1><p class="copy">JFLX a besoin d’une connexion pour accéder à votre serveur Jellyfin et diffuser vos films, séries et chaînes TV. Rétablissez votre connexion puis réessayez.</p><button class="retry" onclick="location.reload()">Réessayer</button></main></body>
</html>
